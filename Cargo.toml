[workspace]
members = [
    "zingo-cli",
    "zingolib",
    "zingo-memo",
    "pepper-sync",
    "zingo-price",
    "zingo-netutils",
    "delegator-tui",
]
exclude = ["libtonode-tests", "zingolib_testutils", "darkside-tests"]

package.edition = "2024"
resolver = "2"

[workspace.dependencies]

# Protocol
bip0039 = { version = "0.13", features = ["rand"] }
bip32 = { version = "0.6.0-pre.1", default-features = false }
zip32 = "0.2.0"

# Zcash
incrementalmerkletree = "0.8.2"
orchard = "0.15.0"
sapling-crypto = "0.7.0"
shardtree = "0.7"
zcash_encoding = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "0735e958575f5567f2cc9a28c5ae426e0adce468", features = [
    "std",
] }
zcash_address = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "0735e958575f5567f2cc9a28c5ae426e0adce468", features = [
    "std",
] }
zcash_client_backend = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "0735e958575f5567f2cc9a28c5ae426e0adce468", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_keys = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "0735e958575f5567f2cc9a28c5ae426e0adce468", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
    "std",
] }
zcash_primitives = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "0735e958575f5567f2cc9a28c5ae426e0adce468", features = [
    "std",
] }
zcash_proofs = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "0735e958575f5567f2cc9a28c5ae426e0adce468" }
zcash_protocol = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "0735e958575f5567f2cc9a28c5ae426e0adce468", features = [
    "std",
] }
zcash_transparent = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "0735e958575f5567f2cc9a28c5ae426e0adce468", features = [
    "std",
] }
zcash_note_encryption = "0.4"

# Zingo-common
# zingo-netutils = "2.0.1"
zingo_common_components = { path = "zingo_common_components" }

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Documentation
simple-mermaid = "0.2.0"

# Test Attributes
test-log = "0.2"

# Misc

tracing = "0.1"
append-only-vec = "0.1.7"
rust_decimal = "1.37.2"
sha2 = "0.10"
bech32 = "0.11.0"
bs58 = "0.5"
byteorder = "1"
bytes = "1"
chrono = "0.4"
clap = "4"
dirs = "6"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1.3"
hyper-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
rustls-pemfile = "2"
x509-parser = "0.18"
indoc = "2"
itertools = "0.14"
json = "0.12"
jubjub = "0.10"
log = "0.4"
log4rs = "1"
memuse = "0.2"
nonempty = "0.11.0"
portpicker = "0.1"
proptest = "1.6.0"
prost = "0.14"
rand = "0.8"
reqwest = { version = "0.12.15", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
ring = "0.17.14"
rust-embed = "8"
rustls = { version = "0.23", features = ["ring"] }
rustyline = "11"
secp256k1 = "0.31.1"
secrecy = "0.8"
serde = "1"
serde_json = "1"
shellwords = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26"
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tower = { version = "0.5" }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing-subscriber = "0.3"
webpki-roots = "1.0.6"

### Terminal UI
ratatui = "0.30"
crossterm = "0.29"
qrcode = { version = "0.14", default-features = false }

# Workspace
zingo-memo = { path = "zingo-memo" } # NOTE: for development between releases
# zingo-memo = "0.1.0"
zingo-price = { path = "zingo-price" }
zingo-status = { path = "zingo-status" } # NOTE: for development between releases
# zingo-status = "0.2.0"
pepper-sync = { path = "pepper-sync" } # NOTE: for development between releases
# pepper-sync = "0.2.0"

zingo-netutils = { path = "zingo-netutils" }
zingolib = { path = "zingolib" }

zingo_test_vectors = { path = "zingo_test_vectors" }

[profile.test]
zcash_local_net = { path = "zcash_local_net" }
opt-level = 3
