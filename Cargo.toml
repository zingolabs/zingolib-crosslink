[workspace]
members = [
    "zingo-cli",
    "zingolib",
    "zingo-memo",
    "pepper-sync",
    "zingo-price",
    "netutils",
]
exclude = ["libtonode-tests", "zingolib_testutils", "darkside-tests"]

resolver = "2"

[workspace.dependencies]
bip0039 = { version = "0.12", features = ["rand"] }
bip32 = { version = "0.6.0-pre.1", default-features = false }

zip32 = "0.2.0"
orchard = "0.11.0"
sapling-crypto = "0.5.0"
incrementalmerkletree = "0.8.2"
shardtree = "0.6.1"
zcash_encoding = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "b0137b8f54ad79bad2f08c37dd6a645f425d9d7b", features = [
    "std",
] }
zcash_address = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "b0137b8f54ad79bad2f08c37dd6a645f425d9d7b", features = [
    "std",
] }
zcash_client_backend = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "b0137b8f54ad79bad2f08c37dd6a645f425d9d7b", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_keys = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "b0137b8f54ad79bad2f08c37dd6a645f425d9d7b", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
    "std",
] }
zcash_primitives = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "b0137b8f54ad79bad2f08c37dd6a645f425d9d7b", features = [
    "std",
] }
zcash_proofs = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "b0137b8f54ad79bad2f08c37dd6a645f425d9d7b" }
zcash_protocol = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "b0137b8f54ad79bad2f08c37dd6a645f425d9d7b", features = [
    "std",
] }
zcash_transparent = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "b0137b8f54ad79bad2f08c37dd6a645f425d9d7b", features = [
    "std",
] }
zcash_note_encryption = "0.4"

zebra-chain = { version = "3.0" }

zingo_common_components = { git = "https://github.com/zingolabs/zingo-common.git", branch = "dev" }

append-only-vec = "0.1.7"
bech32 = "0.11.0"
bs58 = "0.5"
byteorder = "1"
bytes = "1"
chrono = "0.4"
clap = "4"
concat-idents = "1"
dirs = "6"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
http-body = "1"
hyper-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
indoc = "2"
itertools = "0.14"
json = "0.12"
jubjub = "0.10"
log = "0.4"
log4rs = "1"
memuse = "0.2"
nonempty = "0.11.0"
portpicker = "0.1"
proptest = "1.6.0"
prost = "0.14"
rand = "0.8"
reqwest = { version = "0.12.15", default-features = false }
ring = "0.17"
rusqlite = "0.37"
rust_decimal = "1.37.2"
rust-embed = "6"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustyline = "11"
secp256k1 = "0.29.1"
secrecy = "0.8"
serde = "1"
serde_json = "1"
shellwords = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26"
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tonic-build = "0.14"
tower = { version = "0.5" }
tracing = "0.1"
tracing-subscriber = "0.3"
webpki-roots = "0.25"

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Documentation
simple-mermaid = "0.2.0"

# Workspace
zingo-memo = { path = "zingo-memo" }
zingo-price = { path = "zingo-price" }
zingo-status = { path = "zingo-status" }
pepper-sync = { path = "pepper-sync" }
zingolib = { path = "zingolib" }
netutils = { path = "netutils" }

# Test Attributes
test-log = "0.2"

